<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>邓江东 | 个人主页</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Microsoft YaHei", sans-serif;
    }
    body {
      background-color: #f7f9fc;
      color: #333;
      line-height: 1.7;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 60px 20px;
    }
    .header {
      text-align: center;
      margin-bottom: 40px;
    }
    .header h1 {
      font-size: 42px;
      color: #222;
      margin-bottom: 8px;
    }
    .header .title {
      font-size: 18px;
      color: #555;
    }
    section {
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      margin-bottom: 24px;
    }
    h2 {
      font-size: 22px;
      border-left: 4px solid #2c7be5;
      padding-left: 12px;
      margin-bottom: 16px;
    }
    ul {
      padding-left: 20px;
    }
    li {
      margin-bottom: 10px;
    }
    .contact a {
      color: #2c7be5;
      text-decoration: none;
    }
    .contact a:hover {
      text-decoration: underline;
    }
    footer {
      text-align: center;
      margin-top: 40px;
      color: #777;
      font-size:14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Jim </h1>
      <div class="title">AI Coder</div>
    </div>

    <section>
      <h2>个人简介</h2>
      <p>多年企业经营管理经验，专注实体企业运营、项目落地与风险管控。注重合规经营，擅长团队搭建、业务规划与资源整合，持续在实践中打磨企业管理体系。</p>
    </section>

    <section>
      <h2>核心方向</h2>
      <ul>
        <li>企业运营管理，组织架构优化</li>
        <li>项目全周期落地，商务合作洽谈</li>
        <li>经营风险、合同与资金风控管理</li>
      </ul>
    </section>

    <section class="contact">
      <h2>联系方式</h2>
      <p>邮箱：example@xxx.com</p>
      <p>GitHub：<a href="https://github.com/你的用户名" target="_blank">github.com/你的用户名</a></p>
    </section>

    <footer>
      © 2026 Jim. All rights reserved.
    </footer>
  </div>
</body>
</html>
